name: Portable Windows package

on:
  workflow_dispatch:
    inputs:
      fork_run_id:
        description: Optional owned run with successful fork-source job; source and helper hashes must still match
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/portable-windows.yml"
      - "build/**"
      - "native/**"
      - "payload/**"
      - "test/**"
      - "package.json"

permissions:
  actions: read
  contents: read

env:
  BUNDLE_NAME: kiro-paseo-http-0.5.0-windows-x64
  npm_config_audit: "false"
  npm_config_fund: "false"

jobs:
  fork-source:
    if: ${{ !inputs.fork_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: actions/cache@v4
        with:
          path: .work/download-cache
          key: paseo-fork-source-linux-${{ hashFiles('build/inputs.json') }}
          restore-keys: paseo-fork-source-linux-
      - name: Build pinned user fork server, workspaces and complete web UI
        run: node build/build-paseo-fork.mjs --output "$RUNNER_TEMP/paseo-fork" --cache "$GITHUB_WORKSPACE/.work/download-cache"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-paseo-fork
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/paseo-fork/

  build:
    needs: fork-source
    if: ${{ !cancelled() && (needs.fork-source.result == 'success' || (needs.fork-source.result == 'skipped' && inputs.fork_run_id != '')) }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: .work/download-cache
          key: windows-portable-${{ hashFiles('build/inputs.json', 'payload/app/package-lock.json') }}
          restore-keys: windows-portable-
      - name: Authenticate reusable source-job authority
        if: ${{ inputs.fork_run_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_RUN_ID: ${{ inputs.fork_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:FORK_RUN_ID -notmatch '^\d+$') { throw 'Invalid fork source run id' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:FORK_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or
              $run.path -ne '.github/workflows/portable-windows.yml' -or $run.head_branch -ne 'main' -or
              $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
            throw 'Reusable fork must originate from an owned completed main-branch portable run'
          }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:FORK_RUN_ID/jobs?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($jobs.jobs | Where-Object { $_.name -eq 'fork-source' -and $_.conclusion -eq 'success' }).Count -ne 1) {
            throw 'Reusable fork source job was not successful'
          }
      - uses: actions/download-artifact@v4
        with:
          name: portable-paseo-fork
          path: ${{ runner.temp }}/paseo-fork
          run-id: ${{ inputs.fork_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble pinned direct-only Windows distribution
        shell: pwsh
        run: node build/build-bundle.mjs --output "$env:RUNNER_TEMP\$env:BUNDLE_NAME" --cache "$env:GITHUB_WORKSPACE\.work\download-cache" --paseo-fork "$env:RUNNER_TEMP\paseo-fork"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-windows-built
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/${{ env.BUNDLE_NAME }}.zip
            ${{ runner.temp }}/${{ env.BUNDLE_NAME }}.zip.sha256
            ${{ runner.temp }}/${{ env.BUNDLE_NAME }}/bundle-manifest.json

  qualify:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/download-artifact@v4
        with:
          name: portable-windows-built
          path: ${{ runner.temp }}/built
      - name: Extract the actual ZIP into a fresh Unicode path
        id: extract
        shell: pwsh
        run: |
          $extracted = "$env:RUNNER_TEMP\Kiro package 설치"
          [System.IO.Compression.ZipFile]::ExtractToDirectory("$env:RUNNER_TEMP\built\$env:BUNDLE_NAME.zip", $extracted)
          "QUALIFIED_BUNDLE_ROOT=$extracted" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify proxy and private-state invariants
        if: ${{ !cancelled() && steps.extract.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:KIRO_TEST_BUNDLE_ROOT = $env:QUALIFIED_BUNDLE_ROOT
          $fixture = "$env:RUNNER_TEMP\kiro-sspi-fixture.exe"
          cl.exe /nologo /std:c++17 /O2 /MT /EHsc /W4 /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 native/sspi-fixture.cpp "/Fo$env:RUNNER_TEMP\kiro-sspi-fixture.obj" "/Fe$fixture" /link /SUBSYSTEM:CONSOLE /STACK:262144 ws2_32.lib secur32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:KIRO_TEST_SSPI_FIXTURE = $fixture
          npm test
      - name: Exercise offline Python, ripgrep and jq utilities
        if: ${{ !cancelled() && steps.extract.outcome == 'success' }}
        shell: pwsh
        run: node test/windows-utilities.mjs "$env:QUALIFIED_BUNDLE_ROOT" "$env:RUNNER_TEMP\built\qualification"
      - name: Exercise Paseo observation reconnect without prompt replay
        if: ${{ !cancelled() && steps.extract.outcome == 'success' }}
        shell: pwsh
        run: |
          $node = "$env:QUALIFIED_BUNDLE_ROOT\runtime\node\node.exe"
          $report = & $node test/paseo-reconnect.mjs --app "$env:QUALIFIED_BUNDLE_ROOT\app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [System.IO.Directory]::CreateDirectory("$env:RUNNER_TEMP\built\qualification") | Out-Null
          $report | Out-File -FilePath "$env:RUNNER_TEMP\built\qualification\reconnect.json" -Encoding utf8
      - name: Exercise direct HTTP agent, actual web UI and owned cleanup
        if: ${{ !cancelled() && steps.extract.outcome == 'success' }}
        shell: pwsh
        run: node test/windows-smoke.mjs "$env:QUALIFIED_BUNDLE_ROOT" "$env:RUNNER_TEMP\built\qualification"
      - name: Retain qualified ZIP and safe evidence
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows-qualified
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/built/${{ env.BUNDLE_NAME }}.zip
            ${{ runner.temp }}/built/${{ env.BUNDLE_NAME }}.zip.sha256
            ${{ runner.temp }}/built/${{ env.BUNDLE_NAME }}/bundle-manifest.json
            ${{ runner.temp }}/built/qualification/
      - name: Retain safe qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows-evidence
          compression-level: 6
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/built/${{ env.BUNDLE_NAME }}/bundle-manifest.json
            ${{ runner.temp }}/built/qualification/reconnect.json
            ${{ runner.temp }}/built/qualification/report.json
            ${{ runner.temp }}/built/qualification/utilities.json
            ${{ runner.temp }}/built/qualification/web-ui.png
