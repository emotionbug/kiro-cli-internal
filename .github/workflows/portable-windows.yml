name: Portable Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/portable-windows.yml"
      - "build/**"
      - "native/**"
      - "payload/**"
      - "test/**"
      - "package.json"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      BUNDLE_NAME: kiro-paseo-omp-http-0.4.0-windows-x64
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: .work/download-cache
          key: windows-portable-${{ hashFiles('build/inputs.json', 'payload/app/package-lock.json') }}
      - name: Assemble pinned native Windows distribution
        shell: pwsh
        run: node build/build-bundle.mjs --output "$env:RUNNER_TEMP\$env:BUNDLE_NAME" --cache "$env:GITHUB_WORKSPACE\.work\download-cache"
      - name: Extract the actual ZIP into a fresh Unicode path
        shell: pwsh
        run: |
          $extracted = "$env:RUNNER_TEMP\Kiro package 설치"
          [System.IO.Compression.ZipFile]::ExtractToDirectory("$env:RUNNER_TEMP\$env:BUNDLE_NAME.zip", $extracted)
          "QUALIFIED_BUNDLE_ROOT=$extracted" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify proxy and private-state invariants
        shell: pwsh
        run: |
          $env:KIRO_TEST_BUNDLE_ROOT = $env:QUALIFIED_BUNDLE_ROOT
          $fixture = "$env:RUNNER_TEMP\kiro-sspi-fixture.exe"
          cl.exe /nologo /std:c++17 /O2 /MT /EHsc /W4 /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 native/sspi-fixture.cpp "/Fo$env:RUNNER_TEMP\kiro-sspi-fixture.obj" "/Fe$fixture" /link /SUBSYSTEM:CONSOLE /STACK:262144 ws2_32.lib secur32.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:KIRO_TEST_SSPI_FIXTURE = $fixture
          npm test
      - name: Exercise offline Python, ripgrep and jq utilities
        shell: pwsh
        run: node test/windows-utilities.mjs "$env:QUALIFIED_BUNDLE_ROOT" "$env:RUNNER_TEMP\qualification"
      - name: Exercise offline install, actual web UI and OMP tool execution
        shell: pwsh
        run: node test/windows-smoke.mjs "$env:QUALIFIED_BUNDLE_ROOT" "$env:RUNNER_TEMP\qualification"
      - name: Retain qualified ZIP and safe evidence
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows-qualified
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/${{ env.BUNDLE_NAME }}.zip
            ${{ runner.temp }}/${{ env.BUNDLE_NAME }}.zip.sha256
            ${{ runner.temp }}/${{ env.BUNDLE_NAME }}/bundle-manifest.json
            ${{ runner.temp }}/qualification/
      - name: Retain safe qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows-evidence
          compression-level: 6
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/qualification/report.json
            ${{ runner.temp }}/qualification/utilities.json
            ${{ runner.temp }}/qualification/web-ui.png
